# 빠른 검증: build + 단위·API·보안 회귀. E2E와 분리되어 환경 문제와 무관하게 신호를 준다.
# 운영 DB·운영 비밀키를 사용하지 않는다.
name: verify-fast

on:
  push:
    branches: ["m0-write-block", "m1-*", "main"]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: unit + dal
        run: node --test tests/listings.test.mjs tests/ratelimit.test.mjs tests/auth.test.mjs tests/dal-sqlite.test.mjs tests/dal-pg.test.mjs
      - name: api + READ_ONLY regression (isolated sqlite, spawned next start)
        run: node --test tests/api.test.mjs tests/readonly.test.mjs tests/m1auth.test.mjs tests/m1brooms.test.mjs tests/m1agent.test.mjs tests/agent.test.mjs
