name: public-registry-educational-corpus
on:
  pull_request:
    paths:
      - ".github/workflows/public-registry-educational-corpus.yml"
      - "web/scripts/probe-public-registry-pdfs.mjs"
      - "web/scripts/check-registry-public-guidance.mjs"
      - "web/tests/fixtures/registry-web-evidence.v1.json"
      - "web/tests/fixtures/registry-hug-publisher-cases.v1.json"
      - "web/scripts/cache-fictional-registry-pdfs.mjs"
      - "web/tests/fixtures/registry-public-sources.v1.json"
      - "web/lib/registry-pdf-layout.ts"
      - "web/lib/registry-text-extraction.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Validate local private educational PDF downloader syntax
        run: node --check scripts/cache-fictional-registry-pdfs.mjs
      - name: Fetch explicit educational registry PDFs, inspect PDF.js text layer, redact output
        run: node --experimental-strip-types scripts/probe-public-registry-pdfs.mjs
      - name: Cross-check public institutional worked examples and publisher explanations (HTML, no PII logs)
        run: node scripts/check-registry-public-guidance.mjs
