name: directhome-three-chapter-film
on:
  push:
    branches: [feat/three-chapter-hackathon-film-20261103]
    paths:
      - .github/workflows/record-three-chapter-demo.yml
      - web/scripts/record-three-chapter-demo.mjs
      - web/scripts/make-educational-rights-pdf.py
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    defaults:
      run:
        working-directory: web
    env:
      DB_PATH: ./data/three-chapter-film.db
      AGENT_PROVIDER: mock
      RATE_LIMIT_PER_MIN: 1000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare Korean educational PDF generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum ffmpeg
          python3 -m pip install --quiet --break-system-packages 'reportlab==4.4.4'
      - name: Retrieve previously verified Meta model images and JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p demo-evidence/captured
          gh run download 41544487605 -n directhome-real-meta-evidence-20261103 -D demo-evidence/captured
      - name: Create our own fictional PDF
        run: python3 scripts/make-educational-rights-pdf.py demo-evidence/rights-study-synthetic.pdf
      - name: Build DirectHome
        run: npm run build
      - name: Record three in-app sessions with synthetic local test users
        run: |
          export SUPABASE_JWT_SECRET="test-e2e-secret"
          node scripts/record-three-chapter-demo.mjs
      - name: Encode editorial preview MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -i demo-artifacts/three-chapter/directhome-three-chapter-raw.webm -vf "fps=24,scale=1280:720:flags=lanczos" -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -movflags +faststart -an demo-artifacts/three-chapter/directhome-three-chapter-draft.mp4
      - name: Preserve raw footage and editing cues
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directhome-three-chapter-raw
          path: |
            web/demo-artifacts/three-chapter/
            web/demo-evidence/rights-study-synthetic.pdf
          retention-days: 30
          if-no-files-found: warn
