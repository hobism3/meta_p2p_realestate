name: publish-jiptok-english-chat-captions
on:
  push:
    branches:
      - feat/english-chat-captions-final-demo-20261103
      - main
    paths:
      - .github/workflows/publish-jiptok-english-chat-captions.yml
      - web/scripts/overlay-english-jiptok-captions.py
permissions:
  contents: write
jobs:
  caption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editor and PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg poppler-utils fonts-dejavu-core
          python3 -m pip install --quiet 'Pillow==11.3.0'
      - name: Retrieve existing VERIFIED Kokoro video and our own fictional registry PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p web/demo-artifacts/final-subtitled
          gh release download directhome-three-chapter-demo-20261103 \
            -p 'DirectHome_Three_Chapters_Kokoro_OpenWeight_20261103.mp4' \
            -p 'rights-study-synthetic.pdf' \
            -D web/demo-artifacts/final-subtitled
          cd web/demo-artifacts/final-subtitled
          echo '7624c8384271e6ebd5bc092263066432db3656b74454272d9fb33a5144d59403  rights-study-synthetic.pdf' | sha256sum -c -
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 DirectHome_Three_Chapters_Kokoro_OpenWeight_20261103.mp4
      - name: Render authored PDF page (never third-party Dangdang PDF)
        run: |
          pdftoppm -f 1 -l 1 -singlefile -scale-to 1100 -png \
            web/demo-artifacts/final-subtitled/rights-study-synthetic.pdf \
            web/demo-artifacts/final-subtitled/registry_source
      - name: Overlay source document and contextual English Jiptok subtitles
        run: |
          python3 web/scripts/overlay-english-jiptok-captions.py \
            --video web/demo-artifacts/final-subtitled/DirectHome_Three_Chapters_Kokoro_OpenWeight_20261103.mp4 \
            --pdf-image web/demo-artifacts/final-subtitled/registry_source.png \
            --output web/demo-artifacts/final-subtitled/DirectHome_3Chapters_Kokoro_English_Chat_Captions_20261103.mp4
      - name: QA visible document and subtitle locations
        run: |
          cd web/demo-artifacts/final-subtitled
          ffmpeg -hide_banner -loglevel error -y -ss 18 -i DirectHome_3Chapters_Kokoro_English_Chat_Captions_20261103.mp4 -frames:v 1 registration_with_original_pdf.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 94 -i DirectHome_3Chapters_Kokoro_English_Chat_Captions_20261103.mp4 -frames:v 1 jiptok_with_english_subtitles.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 119 -i DirectHome_3Chapters_Kokoro_English_Chat_Captions_20261103.mp4 -frames:v 1 both_parties_confirmation.jpg
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ('registration_with_original_pdf.jpg','jiptok_with_english_subtitles.jpg','both_parties_confirmation.jpg'):
              im=Image.open(name)
              assert im.size==(1280,720),(name,im.size)
              print('FRAME_QA',name,im.size)
          PY
      - name: Archive final film and QA stills
        uses: actions/upload-artifact@v4
        with:
          name: directhome-three-chapter-english-chat-subtitled
          path: |
            web/demo-artifacts/final-subtitled/DirectHome_3Chapters_Kokoro_English_Chat_Captions_20261103.mp4
            web/demo-artifacts/final-subtitled/registration_with_original_pdf.jpg
            web/demo-artifacts/final-subtitled/jiptok_with_english_subtitles.jpg
            web/demo-artifacts/final-subtitled/both_parties_confirmation.jpg
          retention-days: 90
          if-no-files-found: error
      - name: Publish final subtitled MP4 to existing public GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload directhome-three-chapter-demo-20261103 \
            web/demo-artifacts/final-subtitled/DirectHome_3Chapters_Kokoro_English_Chat_Captions_20261103.mp4 --clobber
