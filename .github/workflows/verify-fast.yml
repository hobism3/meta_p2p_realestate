# 빠른 검증: build + 단위·API·보안 회귀. E2E와 분리되어 환경 문제와 무관하게 신호를 준다.
# 운영 DB·운영 비밀키를 사용하지 않는다.
name: verify-fast

on:
  push:
    branches: ["m0-write-block", "m1-*", "main"]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: unit + dal
        run: node --test tests/listings.test.mjs tests/ratelimit.test.mjs tests/auth.test.mjs tests/dal-sqlite.test.mjs tests/dal-pg.test.mjs tests/pg-migration-lock.test.mjs tests/ziptalk.test.mjs tests/broker-companion.test.mjs tests/ziptok-deal-flow.test.mjs tests/visit-dates.test.mjs tests/agreement.test.mjs tests/rent.test.mjs tests/presentation.test.mjs tests/registry-draft.test.mjs tests/register-wizard.test.mjs tests/owner-ai.test.mjs tests/owner-delegate.test.mjs tests/owner-booking-rules.test.mjs tests/owner-booking-expiry.test.mjs tests/sqlite-transaction-queue.test.mjs tests/transaction-projection.test.mjs tests/transaction-state-api.test.mjs tests/real-jiptok-rules.test.mjs tests/trust-compliance.test.mjs tests/registry-review.test.mjs tests/registry-rights-analysis.test.mjs tests/jiptok-support-tasks.test.mjs tests/transaction-journey.test.mjs tests/auth-return.test.mjs tests/photo-guide.test.mjs tests/photo-image.test.mjs tests/gallery-image.test.mjs tests/photo-ai-budget.test.mjs tests/listing-rights-brief.test.mjs
      - name: api + READ_ONLY regression (isolated sqlite, spawned next start)
        run: node --test tests/api.test.mjs tests/readonly.test.mjs tests/m1auth.test.mjs tests/m1brooms.test.mjs tests/m1agent.test.mjs tests/agent.test.mjs tests/m1ziptalk.test.mjs tests/ziptalk-meta-recovery.test.mjs tests/m1deal.test.mjs tests/m1agree.test.mjs tests/ziptok-repair-api.test.mjs tests/owner-ai-api.test.mjs tests/auth-signup.test.mjs tests/real-jiptok-api.test.mjs tests/owner-ai-queue.test.mjs tests/registry-import-privacy-api.test.mjs tests/trust-compliance-api.test.mjs tests/trust-callback-api.test.mjs tests/photo-review-api.test.mjs tests/photo-empty-view-api.test.mjs tests/gallery-api.test.mjs tests/listing-rights-brief-api.test.mjs
