# One-time recording of synthetic, externally verified Meta provider evidence.
# The Vercel sandbox is short-lived; this workflow preserves its files in an
# authenticated GitHub Actions artifact and never handles provider credentials.
name: capture-real-meta-evidence
on:
  push:
    branches: ["feat/real-meta-evidence-20261103"]
    paths: [".github/workflows/capture-real-meta-evidence.yml"]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve real Meta model outputs from short-lived secure capture sandbox
        env:
          EVIDENCE_URL: https://sb-1prixr0keork.vercel.run
        run: |
          mkdir -p web/demo-evidence/captured
          for file in manifest.json source_meta_generated.jpg vision_actual.json empty_view_actual.webp; do
            curl --fail --location --silent --show-error --max-time 35 --retry 1 \
              "$EVIDENCE_URL/$file" -o "web/demo-evidence/captured/$file"
          done
      - name: Verify original Meta evidence hashes, source consistency, and air conditioner detection
        run: |
          cd web/demo-evidence/captured
          echo "af59759ed94169864d77587608dcc8f88e87b74f75f591351a06f883390a47c5  source_meta_generated.jpg" | sha256sum -c -
          echo "23fdd7e442487566dc05052b94aad69065bec2aaba40e9ae3919b15bdf221ded  empty_view_actual.webp" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path("manifest.json").read_text())
          v=json.loads(Path("vision_actual.json").read_text())
          sha=hashlib.sha256(Path("source_meta_generated.jpg").read_bytes()).hexdigest()
          assert m["provider"]=="meta" and m["vision_success"] and m["edit_success"]
          assert sha==m["source_sha256"]==v["sourceSha256"]
          assert v["provider"]=="meta" and v["feature"]=="vision"
          assert v["review"]["room"]=="living_room" and "에어컨" in v["review"]["features"]
          assert Path("empty_view_actual.webp").read_bytes()[:4]==b"RIFF"
          print("REAL_META_EVIDENCE_VERIFIED",sha,"room",v["review"]["room"],"air_conditioner",True)
          PY
      - name: Store synthetic evidence independently of the sandbox
        uses: actions/upload-artifact@v4
        with:
          name: directhome-real-meta-evidence-20261103
          path: web/demo-evidence/captured/
          retention-days: 90
          if-no-files-found: error
