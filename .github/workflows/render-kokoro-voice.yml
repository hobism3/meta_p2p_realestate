name: directhome-licensed-offline-neural-voice
on:
  push:
    branches: [feat/three-chapter-hackathon-film-20261103]
    paths: [.github/workflows/render-kokoro-voice.yml]
permissions:
  contents: read
  actions: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local open-weight TTS
        run: |
          python3 -m pip install --quiet 'kokoro-onnx>=0.3,<1' soundfile
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download public Apache-2.0 model and voice presets
        run: |
          mkdir -p /tmp/tts
          curl -fLsS --retry 2 -o /tmp/tts/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          curl -fLsS --retry 2 -o /tmp/tts/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Obtain previously audited full narration script (not audio)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/tts/cues
          gh run download 41548065231 -R "$GITHUB_REPOSITORY" -n directhome-three-chapter-neural-narration -D /tmp/tts/cues
          test -s /tmp/tts/cues/voice-cues.json
      - name: Speak all 15 scenes entirely offline with Kokoro voice
        run: |
          cat >/tmp/tts/make.py <<'PY'
          from kokoro_onnx import Kokoro
          from pathlib import Path
          import json,subprocess,soundfile as sf
          out=Path('/tmp/tts/render');out.mkdir(exist_ok=True)
          cues=json.loads(Path('/tmp/tts/cues/voice-cues.json').read_text())
          voice=Kokoro('/tmp/tts/kokoro-v1.0.int8.onnx','/tmp/tts/voices-v1.0.bin')
          for seg in cues['segments']:
              i=seg['index']
              samples,rate=voice.create(seg['text'],voice='af_heart',speed=1.06,lang='en-us')
              wav=out/('stem_%02d.wav'%i)
              sf.write(wav,samples,rate)
              mp3=out/seg['file']
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav),'-ar','44100','-ac','2','-q:a','3',str(mp3)],check=True)
              wav.unlink()
              print('KOKORO_VOICE_READY',i,mp3.stat().st_size,flush=True)
          cues['voice']='Kokoro-82M af_heart v1.0 (Apache-2.0, local ONNX inference)'
          (out/'voice-cues.json').write_text(json.dumps(cues,ensure_ascii=False,indent=2))
          PY
          python3 /tmp/tts/make.py
      - uses: actions/upload-artifact@v4
        with:
          name: directhome-three-chapter-open-weight-natural-voice
          path: /tmp/tts/render/
          retention-days: 30
          if-no-files-found: error
